[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
permissioned_token = "8TRoqPLZP6yqBj6qUzqjaotogH7o25tRmhcKGXDPc87d"

[provider]
# localnet is 127.0.0.1:8899. If something else already owns that port the
# validator never starts and the error is opaque — .anchor/test-ledger/
# test-ledger-log.txt shows an HTTP 501 from whatever is actually listening.
# See the README for running against a validator on another port.
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]
